name: track

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect, score, aggregate, build page
        env:
          SCALP_CONTEXT_API_KEY: ${{ secrets.SCALP_CONTEXT_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          node scripts/collect.js --data data
          node scripts/score.js --data data
          node scripts/aggregate.js --data data
          node scripts/build-page.js --data data --out docs
      - name: Commit data and page
        run: |
          git config user.name "edittrades-tracker[bot]"
          git config user.email "edittrades-tracker@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "track: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
