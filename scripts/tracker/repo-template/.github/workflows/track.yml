name: track

# Captures every 10 min (dispatched by the keeper workflow; this schedule is a best-effort
# backup). The page redeploys only on the :07 / :37 runs: other commits carry
# "[skip deploy]", which vercel.json's ignoreCommand skips, keeping Vercel Hobby under
# its daily deployment cap.

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Redeploy the page: auto (only near :07/:37), true, or false'
        default: 'auto'
      test_alert:
        description: 'Also open a test alert issue (checks the email path)'
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect, score, aggregate, build page
        env:
          SCALP_CONTEXT_API_KEY: ${{ secrets.SCALP_CONTEXT_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          node scripts/collect.js --data data
          node scripts/score.js --data data
          node scripts/paths.js --data data
          node scripts/calibration.js --data data
          node scripts/shadow.js --data data
          node scripts/vb-shadow.js --data data
          node scripts/aggregate.js --data data
          node scripts/build-page.js --data data --out docs
          node scripts/build-changelog.js --data data --out docs
      - name: Find new GOOD calls and capture their charts
        env:
          SCALP_CONTEXT_API_KEY: ${{ secrets.SCALP_CONTEXT_API_KEY }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then test=--test; else test=; fi
          node scripts/alerts.js --data data --file "$RUNNER_TEMP/alerts.json" --charts alerts $test
      - name: Commit data and page
        env:
          DEPLOY_INPUT: ${{ github.event.inputs.deploy || 'auto' }}
        run: |
          git config user.name "edittrades-tracker[bot]"
          git config user.email "edittrades-tracker@users.noreply.github.com"
          git add data docs
          if [ -d alerts ]; then git add alerts; fi
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          m=$((10#$(date -u +%M) % 30))
          deploy="$DEPLOY_INPUT"
          if [ "$deploy" = "auto" ]; then
            if [ "$m" -ge 5 ] && [ "$m" -lt 15 ]; then deploy=true; else deploy=false; fi
          fi
          msg="track: $(date -u +%Y-%m-%dT%H:%MZ)"
          [ "$deploy" = "true" ] || msg="$msg [skip deploy]"
          git commit -q -m "$msg"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Open alert issues (GitHub emails the owner); runs only after the push, so charts resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/alerts.json" ] || exit 0
          jq -c '.[]' "$RUNNER_TEMP/alerts.json" | while read -r a; do
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$(jq -r .title <<<"$a")" --body "$(jq -r .body <<<"$a")" \
              || echo "issue create failed for $(jq -r .key <<<"$a")"
          done
