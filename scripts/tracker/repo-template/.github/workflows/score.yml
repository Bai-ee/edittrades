name: score

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Score, aggregate, build page
        run: |
          node scripts/score.js --data data
          node scripts/aggregate.js --data data
          node scripts/build-page.js --data data --out docs
      - name: Commit page and outcomes
        run: |
          git config user.name "edittrades-tracker[bot]"
          git config user.email "edittrades-tracker@users.noreply.github.com"
          git add docs data/outcomes.jsonl data/aggregates.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "score: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
