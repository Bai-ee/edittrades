name: collect

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture scalp-context
        env:
          SCALP_CONTEXT_API_KEY: ${{ secrets.SCALP_CONTEXT_API_KEY }}
        run: node scripts/collect.js --data data
      - name: Commit data
        run: |
          git config user.name "edittrades-tracker[bot]"
          git config user.email "edittrades-tracker@users.noreply.github.com"
          git add data/calls data/candles
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -q -m "data: capture $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
