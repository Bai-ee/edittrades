openapi: 3.1.0
info:
  title: EditTrades Scalp Context
  version: 1.0.0
  description: Read-only endpoint that returns the latest closed-candle BTC, SOL and ETH market context for scalp trading decisions.
servers:
  # Replace with your production domain if different.
  - url: https://snapshottradingview.vercel.app
paths:
  /api/scalp-context:
    get:
      operationId: getScalpContext
      description: Load the latest closed-candle BTC, SOL and ETH market context before answering questions about current setups.
      responses:
        "200":
          description: Latest scalp context for tracked symbols.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalpContext"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Upstream data source unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
      required:
        - error
        - requestId
    Candle:
      type: object
      description: One closed candle.
      properties:
        t:
          type: string
        o:
          type: number
        h:
          type: number
        l:
          type: number
        c:
          type: number
        v:
          type: number
      required:
        - t
        - o
        - h
        - l
        - c
        - v
    StochRsi:
      type: object
      properties:
        k:
          type: [number, "null"]
        d:
          type: [number, "null"]
        state:
          type: [string, "null"]
        cross:
          type: [string, "null"]
        slopeK:
          type: [number, "null"]
        slopeD:
          type: [number, "null"]
    Timeframe:
      type: object
      description: Indicator and candle data for a single timeframe. Field shape is intentionally loose here; consult the live response for exact contents.
      properties:
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        ema21:
          type: [number, "null"]
        ema200:
          type: [number, "null"]
        priceVs21Pct:
          type: [number, "null"]
        priceVs200Pct:
          type: [number, "null"]
        trend:
          type: [string, "null"]
        closedThrough:
          type: [string, "null"]
        candleCount:
          type: integer
        stochRsi:
          $ref: "#/components/schemas/StochRsi"
    EntryZone:
      type: object
      description: Engine entry zone. A bound the engine did not produce is null; it is never fabricated.
      properties:
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
    RiskReward:
      type: object
      description: Engine reward-to-risk ratios for the returned targets.
      properties:
        tp1RR:
          type: [number, "null"]
        tp2RR:
          type: [number, "null"]
    Strategy:
      type: object
      description: >-
        One evaluated EditTrades strategy. Execution levels are exactly what the
        strategy engine returned: an unavailable scalar is null and unavailable
        targets are an empty array, never a placeholder price. When valid is false
        the levels are cleared, so an invalid strategy carries nothing actionable.
      properties:
        valid:
          type: boolean
        direction:
          type: string
          enum:
            - long
            - short
            - NO_TRADE
        confidence:
          description: Ranking score from 0-100. This is a relative signal strength, NOT a probability of the trade winning.
          type: number
        reason:
          type: [string, "null"]
        entryZone:
          $ref: "#/components/schemas/EntryZone"
        stopLoss:
          type: [number, "null"]
        invalidationLevel:
          type: [number, "null"]
        targets:
          description: Ordered engine take-profit prices. Empty when the engine produced none.
          type: array
          items:
            type: number
        riskReward:
          $ref: "#/components/schemas/RiskReward"
        stopSource:
          description: Which timeframe or method the stop was derived from, or null.
          type: [string, "null"]
        entryType:
          type: [string, "null"]
          enum:
            - pullback
            - breakout
            - null
    StrategyTraceEntry:
      type: object
      description: Why one named strategy did or did not produce a signal, for this build.
      properties:
        name:
          type: string
          enum:
            - SWING
            - TREND_4H
            - TREND_RIDER
            - SCALP_1H
            - MICRO_SCALP
        ran:
          description: False only when the strategy engine did not report a result for this name at all.
          type: boolean
        valid:
          type: boolean
        rejectedAt:
          description: >-
            Short, stable classification of the reason text (e.g. "stop-distance",
            "htf-flat", "risk-reward", "confidence"). Null when valid is true.
          type: [string, "null"]
        reason:
          type: [string, "null"]
      required:
        - name
        - ran
        - valid
        - rejectedAt
        - reason
    TimeframeWindowEntry:
      type: object
      description: The exact closed-candle range compute ran on for one timeframe, this build.
      properties:
        from:
          description: Open time of the oldest closed candle in the compute window.
          type: [string, "null"]
          format: date-time
        to:
          description: Close time of the newest closed candle. Equal to that timeframe's closedThrough.
          type: [string, "null"]
          format: date-time
        closedCandles:
          type: integer
      required:
        - from
        - to
        - closedCandles
    DecisionTrace:
      type: object
      description: >-
        Machine-readable explanation of this symbol's strategy evaluation, sourced
        from the same reasons the strategy engine produces internally. Additive:
        never changes a strategy decision, only explains it.
      properties:
        configVersion:
          type: string
        evaluatedAt:
          type: string
          format: date-time
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyTraceEntry"
        bestSignal:
          type: [string, "null"]
        bestSignalReason:
          type: [string, "null"]
        window:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TimeframeWindowEntry"
        candidateSetups:
          description: Reserved for a later phase. Always empty today.
          type: array
          items: {}
        geometry:
          description: Reserved for a later phase. Always null today.
          type: "null"
      required:
        - configVersion
        - evaluatedAt
        - strategies
        - bestSignal
        - bestSignalReason
        - window
        - candidateSetups
        - geometry
    Symbol:
      type: object
      description: Market context for a single tracked symbol. Nested objects are intentionally loose here; consult the live response for exact contents.
      properties:
        price:
          type: number
        source:
          type: object
        structure:
          type: object
        strategies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Strategy"
        bestSignal:
          description: >-
            Name of the strategy carrying the strongest signal for this symbol, or
            null when no strategy produced one.
          type: [string, "null"]
          enum:
            - SWING
            - TREND_4H
            - TREND_RIDER
            - SCALP_1H
            - MICRO_SCALP
            - null
        decisionTrace:
          $ref: "#/components/schemas/DecisionTrace"
        timeframes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Timeframe"
    ScalpContext:
      type: object
      properties:
        schemaVersion:
          type: string
        configVersion:
          type: string
          description: Version of config/engine.json the engine constants came from.
        generatedAt:
          type: string
          format: date-time
        closedThrough:
          type: string
          format: date-time
        sessionTimezone:
          type: string
        dataStatus:
          type: string
          enum:
            - complete
            - partial
            - unavailable
        requestId:
          type: string
        account:
          $ref: "#/components/schemas/Account"
        warnings:
          type: array
          items:
            type: string
        symbols:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Symbol"
      required:
        - schemaVersion
        - configVersion
        - generatedAt
        - closedThrough
        - sessionTimezone
        - dataStatus
        - account
        - requestId
        - warnings
        - symbols
    Account:
      type: object
      description: >-
        Dedicated trading wallet, read-only. margin is risk capital AND the P&L meter.
        holdings are market exposure only and are NOT capital. Never treat a
        non-'available' status as a zero balance, and never claim a trade was placed -
        this endpoint cannot move funds.
      properties:
        status:
          type: string
          description: >-
            available = read and priced; partial = a tracked asset could not be priced, so
            holdingsUsd is incomplete (margin is still exact); unavailable = no capital
            figures at all; disabled = no wallet is tracked.
          enum:
            - available
            - partial
            - unavailable
            - disabled
        reason:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
          description: Masked wallet address, first and last four characters.
        fetchedAt:
          type:
            - string
            - "null"
          format: date-time
        margin:
          type: object
          description: >-
            Stablecoin balances. This is the ONLY risk capital - perps here are
            stablecoin-collateralized - and the only basis for position sizing.
          properties:
            usd:
              type:
                - number
                - "null"
              description: Total stablecoin value in USD. Size against this figure.
            byAsset:
              type: object
              additionalProperties:
                type: number
        holdings:
          type: array
          description: >-
            Priced non-margin positions (SOL, BTC, ETH). Market exposure, NOT capital.
            Use them to notice existing correlated exposure before recommending another
            position in the same direction. Never add them to margin.
          items:
            type: object
            properties:
              asset:
                type: string
              mint:
                type: string
              amount:
                type: number
              usdValue:
                type: number
        holdingsUsd:
          type:
            - number
            - "null"
          description: Total value of priced holdings. Never risk capital.
        unpriced:
          type: array
          description: >-
            Positions deliberately excluded from every total because they cannot be priced
            (unrecognized mints, or a tracked asset with no price). Disclosed, never valued.
          items:
            type: object
            properties:
              asset:
                type:
                  - string
                  - "null"
              mint:
                type: string
              amount:
                type: number
              reason:
                type: string
        gas:
          type: object
          description: Native SOL available to pay transaction fees.
          properties:
            sol:
              type:
                - number
                - "null"
            minSol:
              type:
                - number
                - "null"
            sufficient:
              type:
                - boolean
                - "null"
              description: False means the wallet cannot pay fees, whatever its margin.
        performance:
          type: object
          description: >-
            P&L measured on margin alone, so a move in SOL/BTC/ETH can never appear as a
            trade result. Null throughout when no baseline is configured.
          properties:
            baselineUsd:
              type:
                - number
                - "null"
              description: Margin value when tracking began.
            netPnlUsd:
              type:
                - number
                - "null"
              description: margin.usd minus baselineUsd. Realized P&L since inception.
            returnPct:
              type:
                - number
                - "null"
            source:
              type:
                - string
                - "null"
      required:
        - status
security:
  - bearerAuth: []
