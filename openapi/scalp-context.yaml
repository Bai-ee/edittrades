openapi: 3.1.0
info:
  title: EditTrades Scalp Context
  version: 1.0.0
  description: Read-only endpoint that returns the latest closed-candle BTC, SOL and ETH market context for scalp trading decisions.
servers:
  # Replace with your production domain if different.
  - url: https://snapshottradingview.vercel.app
paths:
  /api/scalp-context:
    get:
      operationId: getScalpContext
      description: >-
        Load the latest closed-candle BTC, SOL and ETH market context before answering
        questions about current setups. All query parameters are optional; omitting
        every one of them returns today's full payload unchanged.
      parameters:
        - name: symbols
          in: query
          required: false
          description: Comma-separated symbols to return. Unknown values are ignored (noted in warnings). Omit for all three.
          schema:
            type: array
            items:
              type: string
              enum: [BTC, SOL, ETH]
          style: form
          explode: false
        - name: include
          in: query
          required: false
          description: >-
            Comma-separated sections to keep, per symbol plus account/config. Unknown
            values are ignored (noted in warnings). Omit for the full payload.
          schema:
            type: array
            items:
              type: string
              enum: [timeframes, strategies, candidates, geometry, account, trace, config]
          style: form
          explode: false
        - name: compact
          in: query
          required: false
          description: When "1" or "true", omit candle arrays and keep only the computed indicator summaries.
          schema:
            type: boolean
        - name: chart
          in: query
          required: false
          description: >-
            One confirmation chart as SYMBOL:TIMEFRAME, e.g. "BTC:1m". When set, the
            response is a single PNG image (image/png) instead of JSON. One chart per
            request; more than one, or an unknown symbol or timeframe, is a 400.
          schema:
            type: string
            pattern: "^(BTC|SOL|ETH):(1m|3m|5m|15m|1h|4h|1d)$"
      responses:
        "200":
          description: Latest scalp context for tracked symbols, or the requested chart when chart is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalpContext"
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid chart parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Upstream data source unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
      required:
        - error
        - requestId
    Candle:
      type: object
      description: One closed candle.
      properties:
        t:
          type: string
        o:
          type: number
        h:
          type: number
        l:
          type: number
        c:
          type: number
        v:
          type: number
      required:
        - t
        - o
        - h
        - l
        - c
        - v
    StochRsi:
      type: object
      properties:
        k:
          type: [number, "null"]
        d:
          type: [number, "null"]
        state:
          type: [string, "null"]
        cross:
          type: [string, "null"]
        slopeK:
          type: [number, "null"]
        slopeD:
          type: [number, "null"]
    Timeframe:
      type: object
      description: Indicator and candle data for a single timeframe. Field shape is intentionally loose here; consult the live response for exact contents.
      properties:
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        ema21:
          type: [number, "null"]
        ema200:
          type: [number, "null"]
        priceVs21Pct:
          type: [number, "null"]
        priceVs200Pct:
          type: [number, "null"]
        trend:
          type: [string, "null"]
        closedThrough:
          type: [string, "null"]
        candleCount:
          type: integer
        stochRsi:
          $ref: "#/components/schemas/StochRsi"
    EntryZone:
      type: object
      description: Engine entry zone. A bound the engine did not produce is null; it is never fabricated.
      properties:
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
    RiskReward:
      type: object
      description: Engine reward-to-risk ratios for the returned targets.
      properties:
        tp1RR:
          type: [number, "null"]
        tp2RR:
          type: [number, "null"]
    Strategy:
      type: object
      description: >-
        One evaluated EditTrades strategy. Execution levels are exactly what the
        strategy engine returned: an unavailable scalar is null and unavailable
        targets are an empty array, never a placeholder price. When valid is false
        the levels are cleared, so an invalid strategy carries nothing actionable.
      properties:
        valid:
          type: boolean
        direction:
          type: string
          enum:
            - long
            - short
            - NO_TRADE
        confidence:
          description: Ranking score from 0-100. This is a relative signal strength, NOT a probability of the trade winning.
          type: number
        reason:
          type: [string, "null"]
        entryZone:
          $ref: "#/components/schemas/EntryZone"
        stopLoss:
          type: [number, "null"]
        invalidationLevel:
          type: [number, "null"]
        targets:
          description: Ordered engine take-profit prices. Empty when the engine produced none.
          type: array
          items:
            type: number
        riskReward:
          $ref: "#/components/schemas/RiskReward"
        stopSource:
          description: Which timeframe or method the stop was derived from, or null.
          type: [string, "null"]
        entryType:
          type: [string, "null"]
          enum:
            - pullback
            - breakout
            - null
        risk:
          description: >-
            Present only when valid is true. Sized against collateralUsd
            (min(config risk.defaultMarginUsd, account.margin.usd)), never the whole
            wallet; never invented. When margin is unavailable every numeric field is
            null and reason names why.
          $ref: "#/components/schemas/Risk"
    Risk:
      type: object
      description: Leverage and loss-at-stop sizing for one valid strategy signal, phase 3.
      properties:
        maxLeverage:
          description: Leverage cap from stop distance alone (this module's own conservative liquidation model).
          type: [integer, "null"]
        suggestedLeverage:
          description: Leverage after the wallet-risk and exchange-max caps are also applied.
          type: [integer, "null"]
        lossAtStopUsd:
          type: [number, "null"]
        lossAtStopPct:
          description: lossAtStopUsd as a percent of collateralUsd.
          type: [number, "null"]
        lossAtStopPctOfWallet:
          description: lossAtStopUsd as a percent of account.margin.usd (the whole wallet), not just collateralUsd.
          type: [number, "null"]
        collateralUsd:
          description: >-
            min(config risk.defaultMarginUsd, account.margin.usd) - what this position was
            actually sized against, not the whole wallet.
          type: [number, "null"]
        reason:
          description: Null when the numbers above are populated; otherwise why they are not.
          type: [string, "null"]
      required:
        - maxLeverage
        - suggestedLeverage
        - lossAtStopUsd
        - lossAtStopPct
        - lossAtStopPctOfWallet
        - collateralUsd
        - reason
    StrategyTraceEntry:
      type: object
      description: Why one named strategy did or did not produce a signal, for this build.
      properties:
        name:
          type: string
          enum:
            - SWING
            - TREND_4H
            - TREND_RIDER
            - SCALP_1H
            - MICRO_SCALP
        ran:
          description: False only when the strategy engine did not report a result for this name at all.
          type: boolean
        valid:
          type: boolean
        rejectedAt:
          description: >-
            Short, stable classification of the reason text (e.g. "stop-distance",
            "htf-flat", "risk-reward", "confidence"). Null when valid is true.
          type: [string, "null"]
        reason:
          type: [string, "null"]
      required:
        - name
        - ran
        - valid
        - rejectedAt
        - reason
    TimeframeWindowEntry:
      type: object
      description: The exact closed-candle range compute ran on for one timeframe, this build.
      properties:
        from:
          description: Open time of the oldest closed candle in the compute window.
          type: [string, "null"]
          format: date-time
        to:
          description: Close time of the newest closed candle. Equal to that timeframe's closedThrough.
          type: [string, "null"]
          format: date-time
        closedCandles:
          type: integer
      required:
        - from
        - to
        - closedCandles
    CandidateSetup:
      type: object
      description: >-
        Continuation flag found on closed candles for one timeframe (1m, 3m, 5m).
        Separate from strategies: a candidate can exist while every strategy is
        NO_TRADE, and it never changes a strategy decision. State is derived from
        the last candles on every request (no memory between calls).
      properties:
        timeframe:
          type: string
          enum: ["1m", "3m", "5m"]
        type:
          type: string
          enum: [flag]
        direction:
          type: string
          enum: [long, short]
        state:
          type: string
          enum: [forming, triggering, confirmed, failed]
        impulseStrength:
          description: Impulse range in ATR multiples.
          type: number
        compressionScore:
          description: 1 minus flag range over impulse range, 0-1. Higher is tighter.
          type: number
        flagHigh:
          type: number
        flagLow:
          type: number
        breakoutLevel:
          description: flagHigh for long, flagLow for short.
          type: number
        invalidation:
          description: flagLow for long, flagHigh for short.
          type: number
        ema21Hold:
          description: >-
            How price treated EMA21 from flag start. Long - hold, wick,
            acceptance_below. Short - hold_below, wick_above, acceptance_above.
            Acceptance means the flag failed.
          type: string
          enum: [hold, wick, acceptance_below, hold_below, wick_above, acceptance_above]
        confidence:
          description: 0-100 score from impulse, compression, EMA21 hold, and Stoch RSI slope.
          type: integer
        chaseRisk:
          description: True when the last close is more than flag.chaseAtr ATRs past the breakout level.
          type: boolean
        risk:
          description: >-
            Present only when state is triggering or confirmed and chaseRisk is false.
            Entry = breakoutLevel, stop = invalidation, sized exactly like a strategy
            signal. When margin is unavailable every numeric field is null and reason
            names why. Absent on forming and failed candidates.
          $ref: "#/components/schemas/Risk"
      required:
        - timeframe
        - type
        - direction
        - state
        - impulseStrength
        - compressionScore
        - flagHigh
        - flagLow
        - breakoutLevel
        - invalidation
        - ema21Hold
        - confidence
        - chaseRisk
    DecisionTrace:
      type: object
      description: >-
        Machine-readable explanation of this symbol's strategy evaluation, sourced
        from the same reasons the strategy engine produces internally. Additive:
        never changes a strategy decision, only explains it.
      properties:
        configVersion:
          type: string
        evaluatedAt:
          type: string
          format: date-time
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyTraceEntry"
        bestSignal:
          type: [string, "null"]
        bestSignalReason:
          type: [string, "null"]
        window:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TimeframeWindowEntry"
        candidateSetups:
          description: >-
            One "timeframe:direction:state" string per entry in the symbol's
            candidateSetups, same order (e.g. "1m:long:confirmed"). Full candidates
            live on the symbol.
          type: array
          items:
            type: string
        geometry:
          description: >-
            One "timeframe:structure:roomUpPct:roomDownPct:extension" string per
            timeframe in the symbol's geometryContext (e.g. "1h:up:0.42:0.18:low"; "na"
            where a value is missing). Full geometry lives on the symbol. Null when no
            geometry was built.
          type: [array, "null"]
          items:
            type: string
      required:
        - configVersion
        - evaluatedAt
        - strategies
        - bestSignal
        - bestSignalReason
        - window
        - candidateSetups
        - geometry
    Symbol:
      type: object
      description: Market context for a single tracked symbol. Nested objects are intentionally loose here; consult the live response for exact contents.
      properties:
        price:
          type: number
        source:
          type: object
        structure:
          type: object
        strategies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Strategy"
        bestSignal:
          description: >-
            Name of the strategy carrying the strongest signal for this symbol, or
            null when no strategy produced one.
          type: [string, "null"]
          enum:
            - SWING
            - TREND_4H
            - TREND_RIDER
            - SCALP_1H
            - MICRO_SCALP
            - null
        candidateSetups:
          description: >-
            Flag candidates on 1m, 3m, 5m, long and short. Independent of
            strategies and bestSignal. Empty when no flag is present.
          type: array
          items:
            $ref: "#/components/schemas/CandidateSetup"
        geometryContext:
          description: >-
            Per-timeframe geometry (pivots, horizontal zones, ATR, room, extension, EMA
            slopes, diagonals, channel, confluence), keyed by timeframe. Built for config
            geometry.timeframes (15m, 1h, 4h by default). A timeframe whose geometry could
            not be built is null.
            Droppable via the include parameter (token "geometry").
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GeometryContext"
        decisionTrace:
          $ref: "#/components/schemas/DecisionTrace"
        timeframes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Timeframe"
    GeometryZone:
      type: object
      description: >-
        Horizontal zone clustered from swing pivots within config
        geometry.zoneToleranceAtr ATRs of each other, with at least
        geometry.minTouches touches.
      properties:
        low:
          type: number
        high:
          type: number
        touches:
          description: Number of swing pivots in the zone.
          type: integer
        lastTouchAt:
          description: Close time of the newest pivot in the zone.
          type: [string, "null"]
          format: date-time
        side:
          description: >-
            Which pivots formed the zone - support (swing lows), resistance (swing
            highs), or both (a flipped level). Its position relative to price is the
            list it appears in.
          type: string
          enum: [support, resistance, both]
      required:
        - low
        - high
        - touches
        - lastTouchAt
        - side
    PivotRun:
      type: object
      description: Consecutive run at the tail of the swing pivots.
      properties:
        active:
          type: boolean
        count:
          type: integer
      required:
        - active
        - count
    GeometryContext:
      type: [object, "null"]
      description: >-
        Geometry for one timeframe on closed candles (phase 7, diagonals/channel/
        confluence phase 8). Separate from
        strategies; never changes a strategy decision. Null when the timeframe has
        too few closed candles for ATR.
      properties:
        timeframe:
          type: string
        atr:
          description: ATR (config geometry.atrPeriod), price units.
          type: number
        atrPct:
          description: ATR as a percent of the last close.
          type: [number, "null"]
        structure:
          description: up = higher high and higher low; down = lower high and lower low; range otherwise; null with too few pivots.
          type: [string, "null"]
          enum: [up, down, range, null]
        higherLows:
          $ref: "#/components/schemas/PivotRun"
        lowerHighs:
          $ref: "#/components/schemas/PivotRun"
        horizontalSupportZones:
          description: Zones below price, nearest first, at most config geometry.maxZonesPerSide.
          type: array
          items:
            $ref: "#/components/schemas/GeometryZone"
        horizontalResistanceZones:
          description: Zones above price, nearest first, at most config geometry.maxZonesPerSide.
          type: array
          items:
            $ref: "#/components/schemas/GeometryZone"
        roomToNextSupport:
          description: Percent from price down to the nearest support zone's top; 0 inside it; null when none.
          type: [number, "null"]
        roomToNextResistance:
          description: Percent from price up to the nearest resistance zone's bottom; 0 inside it; null when none.
          type: [number, "null"]
        extensionRisk:
          description: How far price is from EMA21, in ATRs. Null when EMA21 or ATR is unavailable.
          type: [object, "null"]
          properties:
            atrFromEma21:
              description: Signed; positive above EMA21, negative below.
              type: number
            level:
              description: By magnitude against config geometry.extensionAtr (elevated, high).
              type: string
              enum: [low, elevated, high]
          required:
            - atrFromEma21
            - level
        ema21Slope:
          description: EMA21 change over config geometry.slopeCandles closes, percent per candle.
          type: [number, "null"]
        ema200Slope:
          description: EMA200 change over config geometry.slopeCandles closes, percent per candle.
          type: [number, "null"]
        stochAccelK:
          description: Change in Stoch RSI %K slope between the last two closes. Positive = turning up or rising faster.
          type: [number, "null"]
        confidence:
          description: Evidence completeness 0-100 in steps of 20 (ATR, pivot structure, support zone, resistance zone, EMA slopes). Not a trade score.
          type: integer
        diagonalSupport:
          $ref: "#/components/schemas/Diagonal"
        diagonalResistance:
          $ref: "#/components/schemas/Diagonal"
        channel:
          $ref: "#/components/schemas/Channel"
        confluenceZones:
          description: >-
            Places where two or more independent levels overlap, highest score first,
            then nearest; at most config geometry.maxConfluenceZones.
          type: array
          items:
            $ref: "#/components/schemas/ConfluenceZone"
      required:
        - timeframe
        - atr
        - atrPct
        - structure
        - higherLows
        - lowerHighs
        - horizontalSupportZones
        - horizontalResistanceZones
        - roomToNextSupport
        - roomToNextResistance
        - extensionRisk
        - ema21Slope
        - ema200Slope
        - stochAccelK
        - confidence
        - diagonalSupport
        - diagonalResistance
        - channel
        - confluenceZones
    Diagonal:
      type: object
      description: >-
        Diagonal support (through swing lows) or resistance (through swing highs). Only
        detected with at least config geometry.diagonalMinTouches pivots within
        geometry.zoneToleranceAtr ATRs of the line, spanning geometry.diagonalMinSpanCandles
        candles, a bounce of geometry.diagonalMinBounceAtr ATRs between touches, and no
        close beyond it since the first touch. When detected is false no other field is
        present - a missing line is never guessed.
      properties:
        detected:
          type: boolean
        slope:
          description: Percent of the current level per candle; positive = rising.
          type: number
        touches:
          type: integer
        currentLevel:
          description: The line's value at the newest closed candle.
          type: number
        currentDistancePct:
          description: Percent of price from price to the line; positive while price is on the line's side.
          type: number
        lastTouchAt:
          description: Close time of the newest touching pivot.
          type: [string, "null"]
          format: date-time
        fitError:
          description: RMS distance of the touches from the line, in ATRs.
          type: number
        confidence:
          description: 0-100 from touch count (full at geometry.diagonalFullTouches) and fit; a fit at the tolerance edge halves it.
          type: integer
      required:
        - detected
    Channel:
      type: object
      description: >-
        Channel between a detected diagonal support and resistance whose slopes differ
        by at most config geometry.maxSlopeDivergence of the channel width per candle.
        When detected is false no other field is present.
      properties:
        detected:
          type: boolean
        upper:
          description: Diagonal resistance level now.
          type: number
        lower:
          description: Diagonal support level now.
          type: number
        widthPct:
          description: (upper - lower) as a percent of price.
          type: number
        positionPct:
          description: Where price sits in the channel; 0 = at lower, 100 = at upper.
          type: number
        slope:
          description: Mean slope; flat when it moves less than config geometry.channelFlatSlope of the width per candle.
          type: string
          enum: [rising, falling, flat]
      required:
        - detected
    ConfluenceZone:
      type: object
      description: >-
        Overlap of independent levels within config geometry.confluenceTolAtr ATRs:
        diagonal support/resistance, horizontal zones, EMA21, EMA200, session and
        previous-day high/low. Always two or more distinct components.
      properties:
        low:
          type: number
        high:
          type: number
        components:
          type: array
          items:
            type: string
            enum: [diagonalSupport, diagonalResistance, horizontalZone, ema21, ema200, sessionHigh, sessionLow, prevDayHigh, prevDayLow]
        score:
          description: Number of distinct components; higher = more agreement.
          type: integer
        distancePct:
          description: Percent from price to the zone's near edge; 0 when price is inside it.
          type: number
      required:
        - low
        - high
        - components
        - score
        - distancePct
    ConfigSnapshot:
      type: object
      description: >-
        Tunable engine constants (config/engine.json), so a caller can interpret risk/
        reward figures without a second request. Included by default; droppable via
        the include query param / MCP tool arg.
      properties:
        scalp:
          type: object
          properties:
            maxStopDistancePct:
              type: number
        riskReward:
          type: object
          properties:
            bySetupType:
              type: object
              additionalProperties:
                type: array
                items:
                  type: number
            byStrategy:
              type: object
              additionalProperties:
                type: array
                items:
                  type: number
        risk:
          type: object
          properties:
            maxLeverage:
              type: number
            maxWalletRiskPct:
              type: number
            defaultMarginUsd:
              type: number
            liquidationBufferPct:
              type: number
            maintenanceMarginPct:
              type: number
            feeBps:
              type: number
            slippageBps:
              type: number
        flag:
          type: object
          properties:
            includeFailed:
              type: boolean
    ScalpContext:
      type: object
      properties:
        schemaVersion:
          type: string
        configVersion:
          type: string
          description: Version of config/engine.json the engine constants came from.
        config:
          $ref: "#/components/schemas/ConfigSnapshot"
        generatedAt:
          type: string
          format: date-time
        closedThrough:
          type: string
          format: date-time
        sessionTimezone:
          type: string
        dataStatus:
          type: string
          enum:
            - complete
            - partial
            - unavailable
        requestId:
          type: string
        account:
          $ref: "#/components/schemas/Account"
        warnings:
          type: array
          items:
            type: string
        symbols:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Symbol"
      required:
        - schemaVersion
        - configVersion
        - generatedAt
        - closedThrough
        - sessionTimezone
        - dataStatus
        - account
        - requestId
        - warnings
        - symbols
    Account:
      type: object
      description: >-
        Dedicated trading wallet, read-only. margin is risk capital AND the P&L meter.
        holdings are market exposure only and are NOT capital. Never treat a
        non-'available' status as a zero balance, and never claim a trade was placed -
        this endpoint cannot move funds.
      properties:
        status:
          type: string
          description: >-
            available = read and priced; partial = a tracked asset could not be priced, so
            holdingsUsd is incomplete (margin is still exact); unavailable = no capital
            figures at all; disabled = no wallet is tracked.
          enum:
            - available
            - partial
            - unavailable
            - disabled
        reason:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
          description: Masked wallet address, first and last four characters.
        fetchedAt:
          type:
            - string
            - "null"
          format: date-time
        margin:
          type: object
          description: >-
            Stablecoin balances. This is the ONLY risk capital - perps here are
            stablecoin-collateralized - and the only basis for position sizing.
          properties:
            usd:
              type:
                - number
                - "null"
              description: Total stablecoin value in USD. Size against this figure.
            byAsset:
              type: object
              additionalProperties:
                type: number
        holdings:
          type: array
          description: >-
            Priced non-margin positions (SOL, BTC, ETH). Market exposure, NOT capital.
            Use them to notice existing correlated exposure before recommending another
            position in the same direction. Never add them to margin.
          items:
            type: object
            properties:
              asset:
                type: string
              mint:
                type: string
              amount:
                type: number
              usdValue:
                type: number
        holdingsUsd:
          type:
            - number
            - "null"
          description: Total value of priced holdings. Never risk capital.
        unpriced:
          type: array
          description: >-
            Positions deliberately excluded from every total because they cannot be priced
            (unrecognized mints, or a tracked asset with no price). Disclosed, never valued.
          items:
            type: object
            properties:
              asset:
                type:
                  - string
                  - "null"
              mint:
                type: string
              amount:
                type: number
              reason:
                type: string
        gas:
          type: object
          description: Native SOL available to pay transaction fees.
          properties:
            sol:
              type:
                - number
                - "null"
            minSol:
              type:
                - number
                - "null"
            sufficient:
              type:
                - boolean
                - "null"
              description: False means the wallet cannot pay fees, whatever its margin.
        performance:
          type: object
          description: >-
            P&L measured on margin alone, so a move in SOL/BTC/ETH can never appear as a
            trade result. Null throughout when no baseline is configured.
          properties:
            baselineUsd:
              type:
                - number
                - "null"
              description: Margin value when tracking began.
            netPnlUsd:
              type:
                - number
                - "null"
              description: margin.usd minus baselineUsd. Realized P&L since inception.
            returnPct:
              type:
                - number
                - "null"
            source:
              type:
                - string
                - "null"
      required:
        - status
security:
  - bearerAuth: []
