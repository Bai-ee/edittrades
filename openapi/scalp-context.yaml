openapi: 3.1.0
info:
  title: EditTrades Scalp Context
  version: 1.0.0
  description: Read-only endpoint that returns the latest closed-candle BTC, SOL and ETH market context for scalp trading decisions, plus the user's append-only trade journal (/api/journal, its own bearer key; records what the user said, never executes). Each successful context response is also recorded server-side for the public call tracker (engine calls only, never account data); the response itself is unchanged.
servers:
  # Replace with your production domain if different.
  - url: https://snapshottradingview.vercel.app
paths:
  /api/scalp-context:
    get:
      operationId: getScalpContext
      description: >-
        Load the latest closed-candle BTC, SOL and ETH market context before answering
        questions about current setups. All query parameters are optional; omitting
        every one of them returns today's full payload unchanged.
      parameters:
        - name: symbols
          in: query
          required: false
          description: Comma-separated symbols to return. Unknown values are ignored (noted in warnings). Omit for all three.
          schema:
            type: array
            items:
              type: string
              enum: [BTC, SOL, ETH]
          style: form
          explode: false
        - name: include
          in: query
          required: false
          description: >-
            Comma-separated sections to keep, per symbol plus account/config. Unknown
            values are ignored (noted in warnings). Omit for the full payload. "bias"
            and "model" are opt-in: those bulky objects are only returned when listed,
            e.g. include=bias or include=strategies,trace,model. Pair with compact=1 to
            stay small.
          schema:
            type: array
            items:
              type: string
              enum: [timeframes, strategies, candidates, geometry, account, trace, config, bias, model]
          style: form
          explode: false
        - name: compact
          in: query
          required: false
          description: When "1" or "true", omit candle arrays and keep only the computed indicator summaries; mark narrows to price, driftBps, status.
          schema:
            type: boolean
        - name: chart
          in: query
          required: false
          description: >-
            One confirmation chart as SYMBOL:TIMEFRAME, e.g. "BTC:1m". When set, the
            response is a single PNG image (image/png) instead of JSON. One chart per
            request; more than one, or an unknown symbol or timeframe, is a 400.
          schema:
            type: string
            pattern: "^(BTC|SOL|ETH):(1m|3m|5m|15m|1h|4h|1d)$"
      responses:
        "200":
          description: Latest scalp context for tracked symbols, or the requested chart when chart is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalpContext"
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid chart parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Upstream data source unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/journal:
    post:
      operationId: postJournal
      description: >-
        Record one line of the user's trade journal (the "log" command): a trade they took,
        closed, adjusted or skipped, or a note, in their own words. Never executes or places
        anything. Send only what the user said; never invent numbers. Fill engineRef from the
        latest getScalpContext payload (flagTradePlan.candidateId/planId, flagRecommendation.class
        and primaryReason.code) when the trade matches it. Resending the same id is safe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalPostResult"
        "200":
          description: Already recorded (same id); nothing written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalPostResult"
        "400":
          description: Invalid record (details lists each problem).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid journal bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Body larger than 4 KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: More than 10 journal requests in a minute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Journal store unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getJournal
      description: >-
        Return the user's most recent journal records, newest first (the "journal" command).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: How many records to return. Default 10, max 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent journal records, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalList"
        "401":
          description: Missing or invalid journal bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: More than 10 journal requests in a minute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Journal store unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    JournalEngineRef:
      type: object
      description: The engine call this trade came from, copied from the latest payload. Omit when none matches.
      properties:
        candidateId:
          type: [string, "null"]
        planId:
          type: [string, "null"]
        recClass:
          type: [string, "null"]
          enum: [GOOD, WATCH, BAD, DATA_UNAVAILABLE, null]
        reasonCode:
          type: [string, "null"]
    JournalEntryInput:
      type: object
      required:
        - text
      properties:
        id:
          type: string
          description: Optional client id (8-64 of A-Z a-z 0-9 _ -); resending the same id records nothing new.
        kind:
          type: string
          enum: [open, close, adjust, skip, note]
          description: open = took a trade; close = exited; adjust = moved stop/target/size; skip = passed on a call; note = anything else (default).
        symbol:
          type: [string, "null"]
          description: BTC, ETH, SOL or another ticker.
        direction:
          type: [string, "null"]
          enum: [long, short, null]
        entry:
          type: [number, "null"]
        stop:
          type: [number, "null"]
        tp1:
          type: [number, "null"]
        sizeUsd:
          type: [number, "null"]
        leverage:
          type: [number, "null"]
        exitPrice:
          type: [number, "null"]
        resultR:
          type: [number, "null"]
          description: Result in R as the user stated it (close records).
        resultUsd:
          type: [number, "null"]
        engineRef:
          $ref: "#/components/schemas/JournalEngineRef"
        saidAt:
          type: [string, "null"]
          format: date-time
        text:
          type: string
          maxLength: 1000
          description: What the user said, verbatim. Required.
    JournalRecord:
      type: object
      description: A stored journal line (the input fields plus server-stamped id, receivedAt, schemaVersion).
      properties:
        id:
          type: string
        schemaVersion:
          type: string
        receivedAt:
          type: string
          format: date-time
        saidAt:
          type: [string, "null"]
        kind:
          type: string
          enum: [open, close, adjust, skip, note]
        symbol:
          type: [string, "null"]
        direction:
          type: [string, "null"]
        entry:
          type: [number, "null"]
        stop:
          type: [number, "null"]
        tp1:
          type: [number, "null"]
        sizeUsd:
          type: [number, "null"]
        leverage:
          type: [number, "null"]
        exitPrice:
          type: [number, "null"]
        resultR:
          type: [number, "null"]
        resultUsd:
          type: [number, "null"]
        engineRef:
          $ref: "#/components/schemas/JournalEngineRef"
        text:
          type: string
    JournalPostResult:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
        duplicate:
          type: boolean
        record:
          $ref: "#/components/schemas/JournalRecord"
    JournalList:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/JournalRecord"
        count:
          type: integer
        limit:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
      required:
        - error
        - requestId
    Candle:
      type: object
      description: One closed candle.
      properties:
        t:
          type: string
        o:
          type: number
        h:
          type: number
        l:
          type: number
        c:
          type: number
        v:
          type: number
      required:
        - t
        - o
        - h
        - l
        - c
        - v
    StochRsi:
      type: object
      properties:
        k:
          type: [number, "null"]
        d:
          type: [number, "null"]
        state:
          type: [string, "null"]
        cross:
          type: [string, "null"]
        slopeK:
          type: [number, "null"]
        slopeD:
          type: [number, "null"]
    Timeframe:
      type: object
      description: Indicator and candle data for a single timeframe. Field shape is intentionally loose here; consult the live response for exact contents.
      properties:
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        ema21:
          type: [number, "null"]
        ema200:
          type: [number, "null"]
        priceVs21Pct:
          type: [number, "null"]
        priceVs200Pct:
          type: [number, "null"]
        trend:
          type: [string, "null"]
        closedThrough:
          type: [string, "null"]
        candleCount:
          type: integer
        stochRsi:
          $ref: "#/components/schemas/StochRsi"
    EntryZone:
      type: object
      description: Engine entry zone. A bound the engine did not produce is null; it is never fabricated.
      properties:
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
    RiskReward:
      type: object
      description: Engine reward-to-risk ratios for the returned targets.
      properties:
        tp1RR:
          type: [number, "null"]
        tp2RR:
          type: [number, "null"]
    Strategy:
      type: object
      description: >-
        One evaluated EditTrades strategy. Execution levels are exactly what the
        strategy engine returned: an unavailable scalar is null and unavailable
        targets are an empty array, never a placeholder price. When valid is false
        the levels are cleared, so an invalid strategy carries nothing actionable.
      properties:
        valid:
          type: boolean
        direction:
          type: string
          enum:
            - long
            - short
            - NO_TRADE
        confidence:
          description: Ranking score from 0-100. This is a relative signal strength, NOT a probability of the trade winning.
          type: number
        reason:
          type: [string, "null"]
        entryZone:
          $ref: "#/components/schemas/EntryZone"
        stopLoss:
          type: [number, "null"]
        invalidationLevel:
          type: [number, "null"]
        targets:
          description: Ordered engine take-profit prices. Empty when the engine produced none.
          type: array
          items:
            type: number
        riskReward:
          $ref: "#/components/schemas/RiskReward"
        stopSource:
          description: Which timeframe or method the stop was derived from, or null.
          type: [string, "null"]
        entryType:
          type: [string, "null"]
          enum:
            - pullback
            - breakout
            - null
        risk:
          description: >-
            Present only when valid is true. Sized against collateralUsd
            (min(config risk.defaultMarginUsd, account.margin.usd)), never the whole
            wallet; never invented. When margin is unavailable every numeric field is
            null and reason names why.
          $ref: "#/components/schemas/Risk"
    Risk:
      type: object
      description: Leverage and loss-at-stop sizing for one valid strategy signal, phase 3.
      properties:
        maxLeverage:
          description: Leverage cap from stop distance alone (this module's own conservative liquidation model).
          type: [integer, "null"]
        suggestedLeverage:
          description: Leverage after the wallet-risk and exchange-max caps are also applied.
          type: [integer, "null"]
        lossAtStopUsd:
          type: [number, "null"]
        lossAtStopPct:
          description: lossAtStopUsd as a percent of collateralUsd.
          type: [number, "null"]
        lossAtStopPctOfWallet:
          description: lossAtStopUsd as a percent of account.margin.usd (the whole wallet), not just collateralUsd.
          type: [number, "null"]
        collateralUsd:
          description: >-
            min(config risk.defaultMarginUsd, account.margin.usd) - what this position was
            actually sized against, not the whole wallet.
          type: [number, "null"]
        reason:
          description: Null when the numbers above are populated; otherwise why they are not.
          type: [string, "null"]
      required:
        - maxLeverage
        - suggestedLeverage
        - lossAtStopUsd
        - lossAtStopPct
        - lossAtStopPctOfWallet
        - collateralUsd
        - reason
    StrategyTraceEntry:
      type: object
      description: Why one named strategy did or did not produce a signal, for this build.
      properties:
        name:
          type: string
          enum:
            - SWING
            - TREND_4H
            - TREND_RIDER
            - SCALP_1H
            - MICRO_SCALP
        ran:
          description: False only when the strategy engine did not report a result for this name at all.
          type: boolean
        valid:
          type: boolean
        rejectedAt:
          description: >-
            Short, stable classification of the reason text (e.g. "stop-distance",
            "htf-flat", "risk-reward", "confidence"). Null when valid is true.
          type: [string, "null"]
        reason:
          type: [string, "null"]
      required:
        - name
        - ran
        - valid
        - rejectedAt
        - reason
    TimeframeWindowEntry:
      type: object
      description: >-
        The exact closed-candle range compute ran on for one timeframe, this build.
        Schema 1.10.0 (Phase 11) dropped `from` (the oldest candle's open time) for
        payload headroom; `to` + `closedCandles` still pin the window precisely.
      properties:
        to:
          description: Close time of the newest closed candle. Equal to that timeframe's closedThrough.
          type: [string, "null"]
          format: date-time
        closedCandles:
          type: integer
      required:
        - to
        - closedCandles
    CandidateSetup:
      type: object
      description: >-
        Pattern found on closed candles for one timeframe (1m, 3m, 5m). type flag is a
        continuation flag; type coil (schema 1.9.0) replaces a bull and a bear flag over
        the same range, both forming, with one neutral candidate that carries both
        breakout levels. Separate from strategies: a candidate can exist while every
        strategy is NO_TRADE, and it never changes a strategy decision. State and every
        count are derived from the last candles on every request (no memory between
        calls). Flag-only fields are absent on a coil. Schema 1.15.0: a failed candidate
        publishes only timeframe, type, direction, state, failReason, failedAt,
        candidateId, breakoutLevel, invalidation, confidence and qual (every other field,
        including levelSource and durationCandles, is absent on it).
      properties:
        timeframe:
          type: string
          enum: ["1m", "3m", "5m"]
        type:
          type: string
          enum: [flag, coil]
        direction:
          description: long or short for a flag, neutral for a coil.
          type: string
          enum: [long, short, neutral]
        state:
          description: >-
            A coil is always forming; once one side triggers, that side's flag is
            published instead. proto (schema 1.12.0, F1 item 1) is an impulse that
            qualified with 1 to flag.minCandles-1 pullback candles so far - no entry
            call. expired (schema 1.12.0, F1 item 5) is a flag that stayed confirmed past
            flag.maxBreakoutAge candles since its break, published for
            flag.expiredTtlCandles more with chaseRisk forced true instead of
            disappearing.
          type: string
          enum: [proto, forming, triggering, confirmed, expired, failed]
        impulseStrength:
          description: Flag only. Impulse range in ATR multiples.
          type: number
        compressionScore:
          description: Flag only. 1 minus flag range over impulse range, 0-1. Higher is tighter.
          type: number
        flagHigh:
          description: Flag only.
          type: number
        flagLow:
          description: Flag only.
          type: number
        breakoutLevel:
          description: >-
            Flag only. flagHigh for long, flagLow for short, unless snapped to geometry
            (see levelSource).
          type: number
        invalidation:
          description: >-
            Flag only. flagLow for long, flagHigh for short, unless snapped to geometry
            (see levelSource).
          type: number
        poleHeight:
          description: >-
            Flag only (schema 1.11.0). Absolute price distance of the pole that flagged
            out (impulse trough to peak), used to compute measuredTarget.
          type: number
        measuredTarget:
          description: >-
            Flag only (schema 1.11.0). Pole length projected from breakoutLevel:
            breakoutLevel + poleHeight for long, breakoutLevel - poleHeight for short.
            Recomputed from the final (possibly geometry-snapped) breakoutLevel. A major
            level or channel line in front of it takes priority as the actual TP1. Never
            a moving average.
          type: number
        measuredRR:
          description: >-
            Flag only (schema 1.11.0). |measuredTarget - breakoutLevel| / |breakoutLevel
            - invalidation|, rounded to 2 decimals; null when the denominator is 0.
          type: [number, "null"]
        ema200Side:
          description: >-
            Flag only (schema 1.11.0). "above" or "below" the candidate's own timeframe
            EMA200 (by last close), null when EMA200 is unavailable. Never filters - a
            short above the 200 or a long below it is still published (M-6).
          type: [string, "null"]
          enum: [above, below, null]
        flagSlope:
          description: >-
            Flag only (schema 1.12.0, F1 item 7). Least-squares slope of the flag's own
            closes, percent of their average per candle, sign in real price space
            (positive = rising closes) - not oriented for direction. Null when the flag
            window is too short to fit.
          type: [number, "null"]
        breakoutDistancePct:
          description: >-
            Flag only (schema 1.12.0, F1 item 7). Percent from the last close to
            breakoutLevel, signed; positive means breakoutLevel sits above the last close.
          type: number
        invalidationDistancePct:
          description: >-
            Flag only (schema 1.12.0, F1 item 7). Percent from the last close to
            invalidation, signed the same way as breakoutDistancePct.
          type: number
        candidateId:
          description: >-
            Flag only (schema 1.12.0, F1 item 6). Stable identity across the same flag's
            states - "SYMBOL:timeframe:direction:impulseStart" (impulseStart is the
            close time of the pole's trough candle, the id's own last colon-segment) -
            derived from this request's own candle window (no stored state); unchanged
            while the run advances proto/forming/triggering/confirmed/expired/failed.
            impulseStart and impulseEnd are not separately published: impulseStart is
            this id's last segment; impulseEnd (the pole's peak candle) is always exactly
            firstDetectedAt minus one candle of the timeframe. Dropped to hold the
            default payload under its byte budget - see lib/patternLifecycle.js
            identifyCandidate.
          type: string
        firstDetectedAt:
          description: >-
            Flag only (schema 1.12.0, F1 item 6). Close time of the candle at which this
            flag first met the proto rule (one candle after the pole's peak).
          type: string
          format: date-time
        failedAt:
          description: >-
            Failed only (schema 1.12.0, F1 item 4). Close time of the failure candle
            (the acceptance close, the invalidation close, or the candle the break first
            went stale on). Default-payload visibility past flag.failedTtlCandles of this
            timeframe follows config.flag.includeFailed; decisionTrace.candidateSetups
            still references it either way.
          type: string
          format: date-time
        qual:
          description: >-
            Every candidate, flag or coil (schema 1.12.0, F1 item 8). A compact
            qualification read built only from data already in this payload - never a
            new detection signal, never a probability of profit.
          $ref: "#/components/schemas/CandidateQualification"
        high:
          description: Coil only. Top of the combined range.
          type: number
        low:
          description: Coil only. Bottom of the combined range.
          type: number
        breakoutLevelUp:
          description: Coil only. The bull flag's breakout level.
          type: number
        breakoutLevelDown:
          description: Coil only. The bear flag's breakout level.
          type: number
        levelSource:
          $ref: "#/components/schemas/LevelSource"
        durationCandles:
          description: Candles since the pattern's first flag candle (0 = it started on the last closed candle).
          type: integer
        ageCandles:
          description: Triggering and confirmed only. Candles since the break candle (0 = the break is the last closed candle).
          type: integer
        failReason:
          description: >-
            Failed only. acceptance_below / acceptance_above - closes held through EMA21;
            invalidation_close - a close through invalidation after the break; stale -
            the break sat flag.maxBreakoutAge candles without confirming.
          type: string
          enum: [acceptance_below, acceptance_above, invalidation_close, stale]
        ema21Hold:
          description: >-
            Flag only. How price treated EMA21 from flag start. Long - hold, wick,
            acceptance_below. Short - hold_below, wick_above, acceptance_above. reclaim
            (schema 1.12.0, F1 item 3) - the flag's first candle was off-side but a close
            within flag.reclaimCandles brought it back; same for both directions.
            Acceptance means the flag failed.
          type: string
          enum: [hold, wick, acceptance_below, hold_below, wick_above, acceptance_above, reclaim]
        confidence:
          description: >-
            0-100 score from impulse, compression, EMA21 hold, and Stoch RSI slope. A
            coil carries the higher of its two sides.
          type: integer
        chaseRisk:
          description: Flag only. True when the last close is more than flag.chaseAtr ATRs past the breakout level.
          type: boolean
        risk:
          description: >-
            Present only when state is triggering or confirmed and chaseRisk is false.
            Entry = breakoutLevel, stop = invalidation, sized exactly like a strategy
            signal. When margin is unavailable every numeric field is null and reason
            names why. Absent on forming and failed candidates.
          $ref: "#/components/schemas/Risk"
      required:
        - timeframe
        - type
        - direction
        - state
        - confidence
    LevelSource:
      type: object
      description: >-
        Where each level came from. flag - the flag's own edge; zone - a horizontal
        zone edge; diagonal - a detected diagonal's current level; confluence - a
        confluence zone edge. Geometry is the candidate's own timeframe or the nearest
        higher one with geometry (15m for 1m/3m/5m), within lifecycle.snapTolAtr ATRs.
        A flag carries breakout and invalidation; a coil carries breakoutUp and
        breakoutDown.
      properties:
        breakout:
          type: string
          enum: [flag, zone, diagonal, confluence]
        invalidation:
          type: string
          enum: [flag, zone, diagonal, confluence]
        breakoutUp:
          type: string
          enum: [flag, zone, diagonal, confluence]
        breakoutDown:
          type: string
          enum: [flag, zone, diagonal, confluence]
    CandidateQualification:
      type: object
      description: >-
        Schema 1.12.0, F1 item 8. Built only from data already elsewhere in this
        payload (the symbol's other candidates, its geometryContext, its Stoch RSI, the
        4h bias lean, and the candidate's own ema200Side/chaseRisk/measuredRR); never a
        new detection signal, never a probability of profit.
      properties:
        quality:
          description: Bands the candidate's own 0-100 confidence; not a second, competing score.
          type: string
          enum: [low, med, high]
        decision:
          description: >-
            proto/forming -> watch; triggering -> wait; failed/expired -> dont;
            confirmed with no blocking reason (room:blocked-*, chase, rr:<3) ->
            actionable, else wait. Never a probability of profit.
          type: string
          enum: [watch, wait, dont, actionable]
        reasons:
          description: >-
            Zero or more codes: conflict:<tf>-<dir> (an opposite-direction candidate
            forming or later on another 1m/3m/5m timeframe), stoch:ob-cross /
            stoch:os-cross (the candidate's own timeframe Stoch RSI overbought+bearish-
            cross against a long, oversold+bullish-cross against a short),
            room:blocked-<tf> (a resistance zone for a long, support for a short,
            between breakoutLevel and measuredTarget on that geometry timeframe),
            ema200:counter (ema200Side against the direction), ct:4h (against the 4h
            bias lean), chase (chaseRisk true), rr:<x> (measuredRR below 3).
          type: array
          items:
            type: string
      required:
        - quality
        - decision
        - reasons
    PathOutlook:
      type: [object, "null"]
      description: >-
        Schema 1.19.0 (T4 P1, docs/PLAN_FLAG_PATHS.md). A measured-history read on the
        symbol's live flag candidate - what usually happens from here, with a sample
        size, never an invented probability. Info only: it never changes
        flagTradePlan, flagRecommendation, strategies, bestSignal, or any gate/
        threshold. Candidate choice: flagRecommendation.candidateId's own candidate if
        still live, else flagTradePlan.candidateId's, else the nearest live
        forming/proto/triggering/confirmed 1m/3m/5m flag (triggering > forming > proto
        > confirmed, then confidence, then smaller timeframe, then candidateId). Null
        when no live flag candidate exists this build, or the configured table cannot
        resolve any bucket for it.
      properties:
        id:
          description: The candidateSetups[] entry this read was built from.
          type: string
        tf:
          type: string
          enum: ["1m", "3m", "5m"]
        dir:
          type: string
          enum: [long, short]
        at:
          description: forming/proto -> tightening; triggering/confirmed -> broken.
          type: string
          enum: [tightening, broken]
        lean:
          description: (retest_go+runner) vs (false_break+fail_first); even within 5 points.
          type: string
          enum: [breakout, failure, even]
        likely:
          description: Highest-weight path.
          type: string
          enum: [retest_go, runner, false_break, fail_first, chop]
        chase:
          description: >-
            high - runner share >= retest_go share * 1.2, or the candidate's own
            chaseRisk is true. elevated - runner share above the table-wide baseline
            for this at. else low.
          type: string
          enum: [low, elevated, high]
        w:
          description: >-
            Integer percents summing to ~100. at:"broken" always reads fail_first 0
            (fail_first requires an invalidation close before any breakout close, which
            cannot happen once a candidate has already broken out).
          type: object
          properties:
            retest_go:
              type: integer
            runner:
              type: integer
            false_break:
              type: integer
            fail_first:
              type: integer
            chop:
              type: integer
          required: [retest_go, runner, false_break, fail_first, chop]
        n:
          description: Sample size of the resolved bucket.
          type: integer
        cal:
          description: n >= config pathOutlook.minN (100).
          type: boolean
        key:
          description: >-
            The backoff bucket key actually used, e.g.
            "tf=5m|structureSteps=some|roomR=roomy".
          type: string
      required: [id, tf, dir, at, lean, likely, chase, w, n, cal, key]
    BreakoutEntry:
      type: [object, "null"]
      description: >-
        Schema 1.20.0 (T4 P4, docs/PLAN_FLAG_PATHS.md "P4"), SHADOW MODE ONLY - tracking
        and research, never a trade instruction. Do not act on this field: it is not
        gated by the same review flagTradePlan is, and status is always "shadow". A
        second, shadow-only entry for the symbol's pathOutlook candidate (same
        candidateId): the breakout candle's own close, published only when that candle
        is the FIRST closed candle beyond breakoutLevel (nothing after it) and
        pathOutlook.chase is elevated or high. Gated on the same grossRR >=
        flagPlan.minRR and stop distance <= scalp.maxStopDistancePct the engine uses
        everywhere else - never a lowered bar. Null most of the time: null when
        pathOutlook is null or not "broken", when chase is "low", when the candidate has
        already aged past its own breakout candle, or when the entry fails either gate.
        Never an input to flagTradePlan, flagRecommendation, strategies, bestSignal, or
        any gate/threshold - see lib/breakoutEntry.js. Replay evaluation and the
        promotion recommendation: docs/BREAKOUT_ENTRY_SHADOW.md.
      properties:
        id:
          description: The candidateSetups[] entry this shadow entry was built from (matches pathOutlook.id).
          type: string
        tf:
          type: string
          enum: ["1m", "3m", "5m"]
        dir:
          type: string
          enum: [long, short]
        at:
          description: ISO close time of the breakout candle (the entry fill time).
          type: string
        entry:
          description: The breakout candle's own close.
          type: number
        stop:
          type: number
        tp1:
          description: The candidate's measuredTarget, unadjusted (no geometry TP1 cap).
          type: number
        grossRR:
          type: number
        netRR:
          description: Net of config.risk fees/slippage, same formula flagTradePlan.js uses. Information only.
          type: [number, "null"]
        status:
          description: Always "shadow" - never an executable trade state.
          type: string
          enum: [shadow]
      required: [id, tf, dir, at, entry, stop, tp1, grossRR, netRR, status]
    FlagTradePlan:
      type: [object, "null"]
      description: >-
        Schema 1.13.0 (signal-reliability minimum plan); net gate added 1.21.0 (T6
        phase 1, owner decision D1, variant V1c). The single engine-owned trade
        call for this symbol, built from its confirmed directional flag candidates
        (candidateSetups[] with type=flag, state=confirmed) only - never from a coil,
        never from proto/forming/triggering/failed/expired. A flag candidate is an
        observation; this plan is the one trade call: exact entry condition, final
        entry/stop/TP1(/TP2), gross and net R:R after config.risk fees/slippage (both
        gates), costR (round-trip cost as a fraction of gross risk), and an explicit
        ready/conditional/rejected status with a stable reasonCode. Null when the
        symbol has no confirmed directional flag candidate this build. Independent of
        strategies/bestSignal and of the 4h bias lean - a flat or counter-trend 4h does
        not change this plan's status (see docs/GPT_INSTRUCTIONS.md).
      properties:
        candidateId:
          description: The selected candidateSetups[] entry this plan was built from.
          type: [string, "null"]
        planId:
          description: >-
            candidateId + this build's closedThrough + configVersion, pipe-delimited.
            Changes whenever any of the three change, so a plan can never be mixed with
            a different candidate or an older/newer snapshot.
          type: [string, "null"]
        timeframe:
          type: string
          enum: ["1m", "3m", "5m"]
        direction:
          type: string
          enum: [long, short]
        status:
          description: >-
            ready (schema 1.15.0) - an earlier closed candle closed through the breakout
            level, then the latest closed candle's low (high for a short) reached the
            level within flagPlan.entryToleranceAtr ATR and closed on the hold side.
            conditional - levels and R:R are valid but that sequence has not been
            observed yet (reasonCode awaiting_breakout: no close through the level yet;
            awaiting_retest: closed through, no retest-hold close yet);
            re-evaluated fresh on every request, never a stale hold. rejected - see
            reasonCode.
          type: string
          enum: [ready, conditional, rejected]
        reasonCode:
          description: >-
            Null only when status=ready. awaiting_retest/awaiting_breakout
            (conditional; awaiting_retest replaced awaiting_retest_hold in 1.15.0); invalid_levels, chase, room_at_entry, stop_distance_exceeds_cap,
            rr_below_min (grossRR below flagPlan.minRR; replaced net_rr_below_3 in 1.17.0),
            net_rr_below_min / stop_inside_costs (1.21.0, T6 phase 1: netRR below
            flagPlan.minNetRR, checked after rr_below_min; stop_inside_costs is the
            more specific code when costR >= 0.5 - the round-trip cost alone is already
            over half the position's own risk), stale_data, missing_data (rejected).
          type: [string, "null"]
          enum:
            - awaiting_retest
            - awaiting_breakout
            - invalid_levels
            - chase
            - room_at_entry
            - stop_distance_exceeds_cap
            - rr_below_min
            - net_rr_below_min
            - stop_inside_costs
            - stale_data
            - missing_data
            - null
        entryType:
          description: Null unless status is ready/conditional.
          type: [string, "null"]
          enum: [retest, null]
        entryCondition:
          description: >-
            Exact, literal closed-candle breakout-then-retest-hold condition (entry
            rounded to 2 decimals); quote verbatim, never paraphrase or recompute.
          type: [string, "null"]
        entry:
          description: The candidate's breakoutLevel, read as a retest trigger - never the live market price.
          type: [number, "null"]
        stop:
          description: The candidate's invalidation, unmoved. Never tightened to pass the R:R or stop-distance check.
          type: [number, "null"]
        tp1:
          description: measuredTarget, capped to the nearest horizontal zone edge ahead of entry if one exists short of it.
          type: [number, "null"]
        tp2:
          description: measuredTarget, published only when tp1 was capped and measuredTarget still lies beyond it.
          type: [number, "null"]
        grossRR:
          description: >-
            Schema 1.17.0. Gross price reward:risk to tp1, abs(tp1 - entry) / abs(entry - stop),
            3 decimals. The plan gate - required >= flagPlan.minRR (3.0) for
            ready/conditional, else rejected rr_below_min.
          type: [number, "null"]
        netRR:
          description: >-
            Reward:risk to tp1 net of config.risk.feeBps/slippageBps round-trip cost.
            Information only against flagPlan.minRR (published even on a plan rejected
            for a different reason); since 1.21.0 also the T6 phase 1 gate - below
            flagPlan.minNetRR (when set) the plan is rejected net_rr_below_min or
            stop_inside_costs and the recommendation reflects it as BAD, not a
            non-blocking oppose.
          type: [number, "null"]
        costR:
          description: >-
            Schema 1.21.0 (T6 phase 1). Round-trip fee+slippage cost expressed as a
            fraction of this plan's own gross risk (2 * (config.risk.feeBps +
            slippageBps) / 10000 * entry / abs(entry - stop)) - the same cost amount
            netRR charges against the ratio, here as a plain number so "the stop is too
            tight to pay its own costs" is directly readable. >= 0.5 is what makes a net
            rejection stop_inside_costs instead of net_rr_below_min. Published whenever
            entry/stop are valid (same point grossRR/netRR are computed), independent of
            whether the net gate is on.
          type: [number, "null"]
        stopDistancePct:
          description: abs(entry - stop) / entry * 100. Required <= config.scalp.maxStopDistancePct for ready/conditional.
          type: [number, "null"]
      required:
        - candidateId
        - planId
        - timeframe
        - direction
        - status
        - reasonCode
        - entryType
        - entryCondition
        - entry
        - stop
        - tp1
        - tp2
        - grossRR
        - netRR
        - costR
        - stopDistancePct
    RecommendationReason:
      type: object
      properties:
        code:
          type: string
        text:
          type: string
        refs:
          type: array
          items:
            type: object
      required: [code, text, refs]
    ReasonText:
      type: object
      properties:
        code:
          type: string
        text:
          type: string
      required: [code, text]
    FlagRecommendation:
      type: object
      description: >-
        Schema 1.15.0 (compact). The engine-owned 21/200 flag recommendation for this
        symbol: GOOD, WATCH, BAD, or DATA_UNAVAILABLE. It consumes flagTradePlan plus
        model evidence; it never recalculates entry/stop/target/R:R and never promotes
        legacy bestSignal as the 21/200 recommendation. supports/opposes/unknowns are
        reason codes only (a stale or missing flag timeframe reads e.g. "stale_data:1m");
        the full record with per-reason text, refs and factorStates is
        model.recommendation (include=model). Schema 1.17.0: BAD on rr_below_min
        (gross R:R); a ready/conditional plan carries supports rr_ok (grossRR meets
        flagPlan.minRR). Schema 1.21.0 (T6 phase 1, owner decision D1): BAD also on
        net_rr_below_min / stop_inside_costs (net R:R below flagPlan.minNetRR, when
        set - the same hard-rejection mapping as rr_below_min); a ready/conditional
        plan additionally carries the support net_rr_ok (netRR meets the net floor,
        flagPlan.minNetRR else flagPlan.minRR) or, only when the net floor is off and
        netRR still falls short, the non-blocking oppose fees_heavy (replaces
        net_rr_low) - with the gate on (the shipped default), a plan that reached
        ready/conditional already cleared it, so fees_heavy cannot fire there.
        Schema 1.18.0 (recommendation completeness): every record except
        market_data_unavailable also cites context codes, placed as support/oppose
        for the plan's or named candidate's direction, or as unknown with no
        direction - td:<sentiment>:<n>/4, a200:<above>/<of>, ema200:<tf>:<side>,
        ema200:1w:missing, 4h:with | ct:4h | 4h:flat, level:<geomTf>:<price> (first
        level beyond the breakout on the candidate's own geometry timeframe; oppose
        when before the measured target) or level:none, tp1_capped:<price>,
        chan:<geomTf>:<edge>:<risk>, candidate qual codes conflict:/stoch:/rr:,
        divergence_agrees | divergence_conflicts | divergence_absent |
        divergence_undirected, data_fresh | data_partial. None of these ever changes
        the class. On BAD the disqualifying reason is opposes[0]. changeConditions
        text is concrete - the candidate's close/retest trigger, the rejection's
        remedy (chase retest level, 3R gross, room, stop cap), or "a 1m/3m/5m flag
        must form (none detected)".
      properties:
        class:
          type: string
          enum: [GOOD, WATCH, BAD, DATA_UNAVAILABLE]
        setupId:
          type: [string, "null"]
        candidateId:
          type: [string, "null"]
        candidate:
          type: [object, "null"]
          description: >-
            Schema 1.18.0. The nearest not-yet-confirmed 1m/3m/5m flag named on a
            no-plan WATCH (triggering > forming > proto, then highest confidence, then
            smallest timeframe); null when a plan exists, no flag is detected, or the flag
            timeframes are stale. changeConditions[0].text gives its exact trigger.
          properties:
            candidateId:
              type: [string, "null"]
            timeframe:
              type: string
            direction:
              type: string
              enum: [long, short]
            state:
              type: string
            breakout:
              type: [number, "null"]
            invalidation:
              type: [number, "null"]
            measuredRR:
              type: [number, "null"]
        asOf:
          type: string
          format: date-time
        primaryReason:
          $ref: "#/components/schemas/ReasonText"
        supports:
          type: array
          items:
            type: string
        opposes:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
        changeConditions:
          type: array
          items:
            $ref: "#/components/schemas/ReasonText"
        qualityBand:
          type: [string, "null"]
          enum: [high, medium, low, null]
        readiness:
          type: string
        policyVersion:
          type: string
        trace:
          type: object
      required:
        - class
        - setupId
        - candidateId
        - candidate
        - asOf
        - primaryReason
        - supports
        - opposes
        - unknowns
        - changeConditions
        - qualityBand
        - readiness
        - policyVersion
        - trace
    FlagRecommendationFull:
      type: object
      description: >-
        Schema 1.15.0, include=model only (model.recommendation). The same record as
        flagRecommendation with full reasons: every supports/opposes/unknowns/
        changeConditions entry is {code, text, refs}, plus factorStates.
      properties:
        class:
          type: string
          enum: [GOOD, WATCH, BAD, DATA_UNAVAILABLE]
        setupId:
          type: [string, "null"]
        candidateId:
          type: [string, "null"]
        candidate:
          type: [object, "null"]
          description: >-
            Schema 1.18.0. The nearest not-yet-confirmed 1m/3m/5m flag named on a
            no-plan WATCH (triggering > forming > proto, then highest confidence, then
            smallest timeframe); null when a plan exists, no flag is detected, or the flag
            timeframes are stale. changeConditions[0].text gives its exact trigger.
          properties:
            candidateId:
              type: [string, "null"]
            timeframe:
              type: string
            direction:
              type: string
              enum: [long, short]
            state:
              type: string
            breakout:
              type: [number, "null"]
            invalidation:
              type: [number, "null"]
            measuredRR:
              type: [number, "null"]
        asOf:
          type: string
          format: date-time
        primaryReason:
          $ref: "#/components/schemas/RecommendationReason"
        supports:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationReason"
        opposes:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationReason"
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationReason"
        changeConditions:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationReason"
        factorStates:
          type: array
          items:
            type: object
        qualityBand:
          type: [string, "null"]
          enum: [high, medium, low, null]
        readiness:
          type: string
        policyVersion:
          type: string
        trace:
          type: object
    ModelEvidence:
      type: object
      description: >-
        Opt-in (include=model, schema 1.15.0). Bulky closed-candle evidence behind
        flagRecommendation: per-timeframe EMA21/EMA200 map and pull read, higher-
        timeframe flags, channel/level context, and Stoch RSI divergence. The compact
        flagRecommendation is returned even when this object is omitted.
      properties:
        selectedPlanId:
          type: [string, "null"]
        selectedCandidateId:
          type: [string, "null"]
        flags:
          type: array
          items:
            type: object
        ma:
          type: object
        channels:
          type: object
        divergence:
          description: >-
            Per-timeframe Stoch RSI divergence (most recent pivot pair; Stoch history
            aligned to the candle series' end) and confluence counts. A stale divergence
            (strength 0) is reported but not counted in confluence.
          type: object
        recommendation:
          $ref: "#/components/schemas/FlagRecommendationFull"
    DecisionTrace:
      type: object
      description: >-
        Machine-readable explanation of this symbol's strategy evaluation, sourced
        from the same reasons the strategy engine produces internally. Additive:
        never changes a strategy decision, only explains it.
      properties:
        configVersion:
          type: string
        evaluatedAt:
          type: string
          format: date-time
        strategies:
          type: array
          items:
            $ref: "#/components/schemas/StrategyTraceEntry"
        bestSignal:
          type: [string, "null"]
        bestSignalReason:
          type: [string, "null"]
        window:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TimeframeWindowEntry"
        candidateSetups:
          description: >-
            One "timeframe:direction:state" string per candidate, failed ones included
            even when candidateSetups omits them (e.g. "1m:long:confirmed"). A failed
            candidate adds its failReason as a fourth token (schema 1.10.0), e.g.
            "5m:short:failed:stale". Full candidates live on the symbol.
          type: array
          items:
            type: string
        geometry:
          description: >-
            One "timeframe:structure:roomUpPct:roomDownPct:extension" string per
            timeframe in the symbol's geometryContext (e.g. "1h:up:0.42:0.18:low"; room
            values round to 2 decimals here, schema 1.10.0). A missing individual field
            is an empty position ("1h:up::0.18:"); a timeframe with no geometry at all
            collapses to one token, "1h:na", instead of four (schema 1.10.0, Phase 11).
            Full geometry lives on the symbol.
          type: [array, "null"]
          items:
            type: string
        needsVisualConfirmation:
          description: >-
            True when a non-failed candidate needs a chart before acting on it. Never
            true without a candidate. If true, request the chart named in visualTarget
            or ask the user for that screenshot.
          type: boolean
        visualTarget:
          description: >-
            The candidate that raised the gate, preferring triggering/confirmed over
            forming, then the highest confidence; request it with chart
            "SYMBOL:timeframe". Null when the gate is off.
          type: [object, "null"]
          properties:
            symbol:
              type: string
            timeframe:
              type: string
        unresolvedGeometry:
          description: >-
            Why the gate is on, as "timeframe:code" strings. Codes - low_confidence
            (triggering/confirmed under lifecycle.visualConfidenceFloor),
            near_miss_support / near_miss_resistance (a diagonal one touch short of
            geometry.diagonalMinTouches), coil_near_break (price within
            lifecycle.coilBreakAtr ATRs of a coil breakout), low_geometry (geometry
            confidence under lifecycle.geometryConfidenceFloor). Empty when off. With
            lifecycle.nearMissGate false (default, schema 1.10.0) near_miss codes never
            turn the gate on alone; they are listed only when another code did.
          type: array
          items:
            type: string
        bias:
          description: >-
            Compact bias summary (schema 1.10.0), always present, at most 120 bytes
            pre-1.11.0:
            "scalp:L14,S16,N70|swing:L74,S0,N26|tf:1m=S,3m=S,5m=S,15m=N,1h=L,4h=L,1d=L|ct:2".
            scalp/swing are decisionInputs.directionalBias percentages (long, short,
            neutral); tf is each timeframe's bias letter (L long, S short, N neutral, -
            no data); ct counts counter-trend alignment entries. Schema 1.11.0 appends up
            to two more tokens when the top-down layer succeeded:
            "|td:bull:3/4|a200:5/7" - td is symbols.X.topDown.sentiment (bull, bear, or
            mixed) and how many of the four 1W/1D/4H/1H leans agree (n/4); a200 is
            above200.count/above200.of, the timeframes (of those with an EMA200) sitting
            above it. Schema 1.16.0 appends "|mark:<driftBps>" (e.g. "|mark:1.2") or
            "|mark:na" when no usable Pyth mark, under 12 chars. Full objects via
            include=bias. Null if the bias layer failed.
          type: [string, "null"]
      required:
        - configVersion
        - evaluatedAt
        - strategies
        - bestSignal
        - bestSignalReason
        - window
        - candidateSetups
        - geometry
        - needsVisualConfirmation
        - visualTarget
        - unresolvedGeometry
    Symbol:
      type: object
      description: Market context for a single tracked symbol. Nested objects are intentionally loose here; consult the live response for exact contents.
      properties:
        price:
          description: Close of the newest closed 1m candle (Kraken). Unchanged by mark.
          type: number
        mark:
          $ref: "#/components/schemas/Mark"
        source:
          type: object
        structure:
          type: object
        strategies:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Strategy"
        bestSignal:
          description: >-
            Name of the strategy carrying the strongest signal for this symbol, or
            null when no strategy produced one.
          type: [string, "null"]
          enum:
            - SWING
            - TREND_4H
            - TREND_RIDER
            - SCALP_1H
            - MICRO_SCALP
            - null
        candidateSetups:
          description: >-
            Flag candidates on 1m, 3m, 5m, long and short. Independent of
            strategies and bestSignal. Empty when no flag is present.
          type: array
          items:
            $ref: "#/components/schemas/CandidateSetup"
        geometryContext:
          description: >-
            Per-timeframe geometry (pivots, horizontal zones, ATR, room, extension, EMA
            slopes, diagonals, channel, confluence), keyed by timeframe. Built for config
            geometry.timeframes (15m, 1h, 4h by default). A timeframe whose geometry could
            not be built is null.
            Droppable via the include parameter (token "geometry").
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GeometryContext"
        decisionTrace:
          $ref: "#/components/schemas/DecisionTrace"
        flagTradePlan:
          $ref: "#/components/schemas/FlagTradePlan"
        flagRecommendation:
          $ref: "#/components/schemas/FlagRecommendation"
        pathOutlook:
          $ref: "#/components/schemas/PathOutlook"
        breakoutEntry:
          $ref: "#/components/schemas/BreakoutEntry"
        model:
          $ref: "#/components/schemas/ModelEvidence"
        timeframes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Timeframe"
        biasMatrix:
          description: >-
            Opt-in (include=bias). Per-timeframe lean for 1m, 3m, 5m, 15m, 1h, 4h, 1d; a
            timeframe without data is null.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BiasEntry"
        alignment:
          description: >-
            Opt-in (include=bias). One entry per non-failed candidate, then per valid
            strategy: is it with or against the higher-timeframe lean, and how much room
            it has to the nearest higher-timeframe zone ahead.
          type: array
          items:
            $ref: "#/components/schemas/Alignment"
        decisionInputs:
          $ref: "#/components/schemas/DecisionInputs"
        topDown:
          $ref: "#/components/schemas/TopDown"
    Mark:
      type: object
      description: >-
        Schema 1.16.0. Live Pyth oracle price beside price (the closed 1m candle close).
        Jupiter perps mark, stop and liquidate on Pyth, so check stops, Thesis Eliminated
        and liquidation against mark.price. One Hermes read per build. Unavailable never
        changes dataStatus and adds no warning. Compact mode keeps only price, driftBps,
        status.
      properties:
        price:
          description: Pyth price (price x 10^expo). Null when unavailable.
          type: [number, "null"]
        conf:
          description: Pyth confidence interval, same units as price. Null when unavailable.
          type: [number, "null"]
        publishTime:
          description: Pyth publish time. Null when unavailable.
          type: [string, "null"]
          format: date-time
        source:
          type: string
          enum: [pyth]
        ageSec:
          description: Seconds from publishTime to the build time. Null when unavailable.
          type: [integer, "null"]
        driftBps:
          description: >-
            (mark.price - price) / price x 10000, 1 decimal. Positive = mark above the
            candle close. Null when unavailable or price is null.
          type: [number, "null"]
        status:
          description: >-
            ok; stale when ageSec exceeds config mark.pyth.maxAgeSec (30); unavailable
            when the read failed or no key is configured (other fields null).
          type: string
          enum: [ok, stale, unavailable]
      required:
        - price
        - driftBps
        - status
    BiasEntry:
      type: object
      description: >-
        One timeframe's lean from its trend, EMA21/EMA200 stack, price vs EMA21, EMA
        slopes, higher lows / lower highs, channel edge and Stoch RSI state. Same rules
        for long and short.
      properties:
        bias:
          type: string
          enum: [long, short, neutral]
        strength:
          description: Weighted agreement of the signals, 0-100. Under bias.neutralBelow reads neutral.
          type: integer
        basis:
          description: >-
            The signals that leaned, e.g. trend:up, ema21>ema200, price>ema21,
            ema:rising, higherLows, channel:bottom, stoch:bullish (short-side twins
            trend:down, ema21<ema200, price<ema21, ema:falling, lowerHighs,
            channel:top, stoch:bearish).
          type: array
          items:
            type: string
      required: [bias, strength, basis]
    Alignment:
      type: object
      properties:
        source:
          type: string
          enum: [candidate, strategy]
        ref:
          description: Candidate trace ref ("1m:short:forming") or strategy name.
          type: string
        direction:
          type: string
          enum: [long, short, neutral]
        executionTf:
          type: string
        contextTfs:
          description: Higher timeframes that judge the trend for this execution timeframe (config bias.contextTimeframes).
          type: array
          items:
            type: string
        withTrend:
          type: boolean
        counterTrend:
          type: boolean
        htfBias:
          type: string
          enum: [long, short, neutral]
        htfBiasStrength:
          type: integer
        nearestHtfZoneDistancePct:
          description: >-
            Percent from price to the nearest context-timeframe zone ahead of the trade
            (resistance for a long, support for a short); 0 when price is inside it;
            null when none.
          type: [number, "null"]
        room:
          description: That distance in ATRs of the zone's timeframe; null when no zone.
          type: [number, "null"]
        roomTooSmall:
          description: True when room is under bias.minRoomAtr.
          type: boolean
      required: [source, ref, direction, executionTf, contextTfs, withTrend, counterTrend, htfBias, htfBiasStrength, nearestHtfZoneDistancePct, room, roomTooSmall]
    DirectionalTriple:
      type: object
      description: Integer percentages summing to 100.
      properties:
        long:
          type: integer
        short:
          type: integer
        neutral:
          type: integer
      required: [long, short, neutral]
    DecisionInputs:
      type: object
      description: >-
        Opt-in (include=bias). Named inputs for the GPT's own GO IN / HOLD-WAIT / DON'T
        allocation; the API never emits that allocation. scalp weighs 1m-1h, swing
        1h-1d (config bias.horizons); on scalp, a timeframe leaning against the swing
        horizon keeps (1 - bias.counterTrendPenalty) of its strength.
      properties:
        directionalBias:
          type: object
          properties:
            scalp:
              $ref: "#/components/schemas/DirectionalTriple"
            swing:
              $ref: "#/components/schemas/DirectionalTriple"
          required: [scalp, swing]
      required: [directionalBias]
    TopDown:
      type: object
      description: >-
        Opt-in (include=bias, schema 1.11.0). Top-down sentiment over 1W/1D/4H/1H (M-1,
        M-2, M-6b): a weighted vote (config model.topDownWeights; higher timeframes
        dominate) over the four leans. 1W is derived from the already-fetched 1D
        candles (Monday-aligned weeks); 1D/4H/1H reuse decisionTrace.bias's own bias
        matrix. Never gates or changes a strategy, candidate, or confidence - alignment
        only adjusts confidence.
      properties:
        sentiment:
          type: string
          enum: [bull, bear, mixed]
        aligned:
          description: >-
            How many of the four leans (1w, 1d, 4h, 1h) agree with sentiment, 0-4. For
            mixed (2026-09-23 follow-up), the weighted vote cancelled out but the leans
            still split some way; aligned is the larger of the bull count and the bear
            count (a neutral lean counts toward neither), ties going to the bull count.
          type: integer
        score:
          description: Weighted conviction of the vote, 0-1.
          type: number
        leans:
          type: object
          properties:
            "1w":
              type: string
              enum: [bull, bear, neutral]
            "1d":
              type: string
              enum: [bull, bear, neutral]
            "4h":
              type: string
              enum: [bull, bear, neutral]
            "1h":
              type: string
              enum: [bull, bear, neutral]
          required: ["1w", "1d", "4h", "1h"]
        weekly:
          type: object
          description: >-
            The 1W lean: last weekly close vs weekly EMA21 and its 3-week slope. Weekly
            EMA200 is always null - not enough weekly history exists for it - with a
            reason.
          properties:
            close:
              type: [number, "null"]
            ema21:
              type: [number, "null"]
            ema21Slope:
              type: [number, "null"]
            ema200:
              description: Always null - not enough weekly history exists to compute it (see reason).
              type: [number, "null"]
            reason:
              type: [string, "null"]
          required: [close, ema21, ema21Slope, ema200, reason]
        above200:
          type: object
          description: >-
            Of the timeframes with an EMA200 (1m-1D), how many sit above it, weighted so
            higher timeframes count for more (config model.above200Weights). Never
            filters anything.
          properties:
            count:
              type: integer
            of:
              type: integer
            weighted:
              type: [number, "null"]
          required: [count, of, weighted]
      required: [sentiment, aligned, score, leans, weekly, above200]
    GeometryZone:
      type: object
      description: >-
        Horizontal zone clustered from swing pivots within config
        geometry.zoneToleranceAtr ATRs of each other, with at least
        geometry.minTouches touches.
      properties:
        low:
          type: number
        high:
          type: number
        touches:
          description: Number of swing pivots in the zone.
          type: integer
        lastTouchAt:
          description: Close time of the newest pivot in the zone.
          type: [string, "null"]
          format: date-time
        side:
          description: >-
            Which pivots formed the zone - support (swing lows), resistance (swing
            highs), or both (a flipped level). Its position relative to price is the
            list it appears in.
          type: string
          enum: [support, resistance, both]
      required:
        - low
        - high
        - touches
        - lastTouchAt
        - side
    PivotRun:
      type: object
      description: Consecutive run at the tail of the swing pivots.
      properties:
        active:
          type: boolean
        count:
          type: integer
      required:
        - active
        - count
    GeometryContext:
      type: [object, "null"]
      description: >-
        Geometry for one timeframe on closed candles (phase 7, diagonals/channel/
        confluence phase 8). Separate from
        strategies; never changes a strategy decision. Null when the timeframe has
        too few closed candles for ATR.
      properties:
        timeframe:
          type: string
        atr:
          description: ATR (config geometry.atrPeriod), price units.
          type: number
        atrPct:
          description: ATR as a percent of the last close.
          type: [number, "null"]
        structure:
          description: up = higher high and higher low; down = lower high and lower low; range otherwise; null with too few pivots.
          type: [string, "null"]
          enum: [up, down, range, null]
        higherLows:
          $ref: "#/components/schemas/PivotRun"
        lowerHighs:
          $ref: "#/components/schemas/PivotRun"
        horizontalSupportZones:
          description: Zones below price, nearest first, at most config geometry.maxZonesPerSide.
          type: array
          items:
            $ref: "#/components/schemas/GeometryZone"
        horizontalResistanceZones:
          description: Zones above price, nearest first, at most config geometry.maxZonesPerSide.
          type: array
          items:
            $ref: "#/components/schemas/GeometryZone"
        roomToNextSupport:
          description: Percent from price down to the nearest support zone's top; 0 inside it; null when none.
          type: [number, "null"]
        roomToNextResistance:
          description: Percent from price up to the nearest resistance zone's bottom; 0 inside it; null when none.
          type: [number, "null"]
        extensionRisk:
          description: How far price is from EMA21, in ATRs. Null when EMA21 or ATR is unavailable.
          type: [object, "null"]
          properties:
            atrFromEma21:
              description: Signed; positive above EMA21, negative below.
              type: number
            level:
              description: By magnitude against config geometry.extensionAtr (elevated, high).
              type: string
              enum: [low, elevated, high]
          required:
            - atrFromEma21
            - level
        ema21Slope:
          description: EMA21 change over config geometry.slopeCandles closes, percent per candle.
          type: [number, "null"]
        ema200Slope:
          description: EMA200 change over config geometry.slopeCandles closes, percent per candle.
          type: [number, "null"]
        stochAccelK:
          description: Change in Stoch RSI %K slope between the last two closes. Positive = turning up or rising faster.
          type: [number, "null"]
        confidence:
          description: Evidence completeness 0-100 in steps of 20 (ATR, pivot structure, support zone, resistance zone, EMA slopes). Not a trade score.
          type: integer
        diagonalSupport:
          $ref: "#/components/schemas/Diagonal"
        diagonalResistance:
          $ref: "#/components/schemas/Diagonal"
        channel:
          $ref: "#/components/schemas/Channel"
        confluenceZones:
          description: >-
            Places where two or more independent levels overlap, highest score first,
            then nearest; at most config geometry.maxConfluenceZones.
          type: array
          items:
            $ref: "#/components/schemas/ConfluenceZone"
      required:
        - timeframe
        - atr
        - atrPct
        - structure
        - higherLows
        - lowerHighs
        - horizontalSupportZones
        - horizontalResistanceZones
        - roomToNextSupport
        - roomToNextResistance
        - extensionRisk
        - ema21Slope
        - ema200Slope
        - stochAccelK
        - confidence
        - diagonalSupport
        - diagonalResistance
        - channel
        - confluenceZones
    Diagonal:
      type: object
      description: >-
        Diagonal support (through swing lows) or resistance (through swing highs). Only
        detected with at least config geometry.diagonalMinTouches pivots within
        geometry.zoneToleranceAtr ATRs of the line, spanning geometry.diagonalMinSpanCandles
        candles, a bounce of geometry.diagonalMinBounceAtr ATRs between touches, and no
        close beyond it since the first touch. When detected is false no other field is
        present - a missing line is never guessed.
      properties:
        detected:
          type: boolean
        slope:
          description: Percent of the current level per candle; positive = rising.
          type: number
        touches:
          type: integer
        currentLevel:
          description: The line's value at the newest closed candle.
          type: number
        currentDistancePct:
          description: Percent of price from price to the line; positive while price is on the line's side.
          type: number
        lastTouchAt:
          description: Close time of the newest touching pivot.
          type: [string, "null"]
          format: date-time
        fitError:
          description: RMS distance of the touches from the line, in ATRs.
          type: number
        confidence:
          description: 0-100 from touch count (full at geometry.diagonalFullTouches) and fit; a fit at the tolerance edge halves it.
          type: integer
      required:
        - detected
    Channel:
      type: object
      description: >-
        Channel between a detected diagonal support and resistance whose slopes differ
        by at most config geometry.maxSlopeDivergence of the channel width per candle.
        When detected is false no other field is present.
      properties:
        detected:
          type: boolean
        upper:
          description: Diagonal resistance level now.
          type: number
        lower:
          description: Diagonal support level now.
          type: number
        widthPct:
          description: (upper - lower) as a percent of price.
          type: number
        positionPct:
          description: Where price sits in the channel; 0 = at lower, 100 = at upper.
          type: number
        slope:
          description: Mean slope; flat when it moves less than config geometry.channelFlatSlope of the width per candle.
          type: string
          enum: [rising, falling, flat]
      required:
        - detected
    ConfluenceZone:
      type: object
      description: >-
        Overlap of independent levels within config geometry.confluenceTolAtr ATRs:
        diagonal support/resistance, horizontal zones, EMA21, EMA200, session and
        previous-day high/low. Always two or more distinct components.
      properties:
        low:
          type: number
        high:
          type: number
        components:
          type: array
          items:
            type: string
            enum: [diagonalSupport, diagonalResistance, horizontalZone, ema21, ema200, sessionHigh, sessionLow, prevDayHigh, prevDayLow]
        score:
          description: Number of distinct components; higher = more agreement.
          type: integer
        distancePct:
          description: Percent from price to the zone's near edge; 0 when price is inside it.
          type: number
      required:
        - low
        - high
        - components
        - score
        - distancePct
    ConfigSnapshot:
      type: object
      description: >-
        Tunable engine constants (config/engine.json), so a caller can interpret risk/
        reward figures without a second request. Included by default; droppable via
        the include query param / MCP tool arg.
      properties:
        scalp:
          type: object
          properties:
            maxStopDistancePct:
              type: number
        riskReward:
          type: object
          properties:
            bySetupType:
              type: object
              additionalProperties:
                type: array
                items:
                  type: number
            byStrategy:
              type: object
              additionalProperties:
                type: array
                items:
                  type: number
        risk:
          type: object
          properties:
            maxLeverage:
              type: number
            maxWalletRiskPct:
              type: number
            defaultMarginUsd:
              type: number
            liquidationBufferPct:
              type: number
            maintenanceMarginPct:
              type: number
            feeBps:
              type: number
            slippageBps:
              type: number
        flag:
          type: object
          properties:
            includeFailed:
              type: boolean
    ScalpContext:
      type: object
      properties:
        schemaVersion:
          type: string
        configVersion:
          type: string
          description: Version of config/engine.json the engine constants came from.
        config:
          $ref: "#/components/schemas/ConfigSnapshot"
        generatedAt:
          type: string
          format: date-time
        closedThrough:
          type: string
          format: date-time
        sessionTimezone:
          type: string
        dataStatus:
          type: string
          enum:
            - complete
            - partial
            - unavailable
        requestId:
          type: string
        account:
          $ref: "#/components/schemas/Account"
        warnings:
          type: array
          items:
            type: string
        symbols:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Symbol"
      required:
        - schemaVersion
        - configVersion
        - generatedAt
        - closedThrough
        - sessionTimezone
        - dataStatus
        - account
        - requestId
        - warnings
        - symbols
    Account:
      type: object
      description: >-
        Dedicated trading wallet, read-only. margin is risk capital AND the P&L meter.
        holdings are market exposure only and are NOT capital. Never treat a
        non-'available' status as a zero balance, and never claim a trade was placed -
        this endpoint cannot move funds.
      properties:
        status:
          type: string
          description: >-
            available = read and priced; partial = a tracked asset could not be priced, so
            holdingsUsd is incomplete (margin is still exact); unavailable = no capital
            figures at all; disabled = no wallet is tracked.
          enum:
            - available
            - partial
            - unavailable
            - disabled
        reason:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
          description: Masked wallet address, first and last four characters.
        fetchedAt:
          type:
            - string
            - "null"
          format: date-time
        margin:
          type: object
          description: >-
            Stablecoin balances. This is the ONLY risk capital - perps here are
            stablecoin-collateralized - and the only basis for position sizing.
          properties:
            usd:
              type:
                - number
                - "null"
              description: Total stablecoin value in USD. Size against this figure.
            byAsset:
              type: object
              additionalProperties:
                type: number
        holdings:
          type: array
          description: >-
            Priced non-margin positions (SOL, BTC, ETH). Market exposure, NOT capital.
            Use them to notice existing correlated exposure before recommending another
            position in the same direction. Never add them to margin.
          items:
            type: object
            properties:
              asset:
                type: string
              mint:
                type: string
              amount:
                type: number
              usdValue:
                type: number
        holdingsUsd:
          type:
            - number
            - "null"
          description: Total value of priced holdings. Never risk capital.
        unpriced:
          type: array
          description: >-
            Positions deliberately excluded from every total because they cannot be priced
            (unrecognized mints, or a tracked asset with no price). Disclosed, never valued.
          items:
            type: object
            properties:
              asset:
                type:
                  - string
                  - "null"
              mint:
                type: string
              amount:
                type: number
              reason:
                type: string
        gas:
          type: object
          description: Native SOL available to pay transaction fees.
          properties:
            sol:
              type:
                - number
                - "null"
            minSol:
              type:
                - number
                - "null"
            sufficient:
              type:
                - boolean
                - "null"
              description: False means the wallet cannot pay fees, whatever its margin.
        performance:
          type: object
          description: >-
            P&L measured on margin alone, so a move in SOL/BTC/ETH can never appear as a
            trade result. Null throughout when no baseline is configured.
          properties:
            baselineUsd:
              type:
                - number
                - "null"
              description: Margin value when tracking began.
            netPnlUsd:
              type:
                - number
                - "null"
              description: margin.usd minus baselineUsd. Realized P&L since inception.
            returnPct:
              type:
                - number
                - "null"
            source:
              type:
                - string
                - "null"
      required:
        - status
security:
  - bearerAuth: []
